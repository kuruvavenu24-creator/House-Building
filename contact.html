<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bg-dark text-white text-center p-5">
    <h1>📩 Contact Us</h1>
    <p>Get Help With House Construction</p>
  </header>

  <main class="container my-5 fade-in">

    <div class="card p-4 shadow">
      <h2>Send a Message</h2>

      <form>
        <input class="form-control mt-3" type="text" placeholder="Your Name" required>
        <input class="form-control mt-3" type="email" placeholder="Your Email" required>
        <textarea class="form-control mt-3" rows="4" placeholder="Your Message" required></textarea>

        <button class="btn btn-dark mt-4 w-100">Submit</button>
      </form>
    </div>

  </main>

  <footer class="bg-dark text-white text-center p-3">
    © 2026 House Website | Contact Page
  </footer>

  <script src="script.js"></script>

</body>
</html>
