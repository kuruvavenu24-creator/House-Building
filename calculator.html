<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Cost Calculator</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bg-dark text-white text-center p-5">
    <h1>🏡 House Cost Calculator</h1>
    <p>Estimate Your Construction Budget</p>
  </header>

  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">HouseSite</a>
      <div>
        <a class="btn btn-light btn-sm" href="index.html">Home</a>
        <a class="btn btn-light btn-sm" href="gallery.html">Gallery</a>
        <a class="btn btn-light btn-sm" href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <main class="container my-5 fade-in">

    <div class="card p-4 shadow">
      <h2>Calculate Construction Cost</h2>

      <label class="form-label mt-3">Enter Area (Square Feet):</label>
      <input type="number" id="area" class="form-control" placeholder="Example: 1200">

      <label class="form-label mt-3">Cost Per Sq.Ft (₹):</label>
      <input type="number" id="rate" class="form-control" placeholder="Example: 1800">

      <button class="btn btn-dark mt-4 w-100" onclick="calculateCost()">
        Calculate Total Cost
      </button>

      <h3 class="text-success text-center mt-4" id="result"></h3>
    </div>

  </main>

  <footer class="bg-dark text-white text-center p-3">
    © 2026 House Website | Calculator Page
  </footer>

  <script>
    function calculateCost() {
      let area = document.getElementById("area").value;
      let rate = document.getElementById("rate").value;

      let total = area * rate;

      document.getElementById("result").innerHTML =
        "Estimated Cost: ₹" + total.toLocaleString();
    }
  </script>

</body>
</html>
