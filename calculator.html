<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>House Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bg-dark text-white text-center p-5">
  <h1>🏗️ Construction Calculator</h1>
  <p>Cost + Material Quantity Estimation</p>
</header>

<!-- SAME NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">HouseSite</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link active" href="calculator.html">Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-5 fade-in">

<div class="card p-4 shadow">
  <h3>Total Construction Cost</h3>

  <input id="area" class="form-control mt-3" placeholder="Total Area (sq.ft)">
  <input id="rate" class="form-control mt-3" placeholder="Cost per sq.ft (₹)">

  <button class="btn btn-dark w-100 mt-4" onclick="calculate()">
    Calculate
  </button>

  <h4 class="text-success text-center mt-4" id="totalCost"></h4>
</div>

<div class="card p-4 shadow mt-5">
  <h3>Material Quantity (Approx)</h3>

  <table class="table table-bordered text-center">
    <tr><th>Material</th><th>Quantity</th></tr>
    <tr><td>Cement</td><td id="cement"></td></tr>
    <tr><td>Steel</td><td id="steel"></td></tr>
    <tr><td>Bricks</td><td id="bricks"></td></tr>
    <tr><td>Sand</td><td id="sand"></td></tr>
  </table>
</div>

</main>

<footer class="bg-dark text-white text-center p-3">
  © 2026 House Website
</footer>

<script>
function calculate() {
  let area = document.getElementById("area").value;
  let rate = document.getElementById("rate").value;

  let total = area * rate;
  document.getElementById("totalCost").innerHTML =
    "Estimated Cost: ₹" + total.toLocaleString();

  // Material calculations (industry approx)
  document.getElementById("cement").innerHTML = Math.round(area * 0.4) + " bags";
  document.getElementById("steel").innerHTML = (area * 0.004).toFixed(2) + " tons";
  document.getElementById("bricks").innerHTML = Math.round(area * 8) + " bricks";
  document.getElementById("sand").innerHTML = Math.round(area * 1.2) + " cu.ft";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
