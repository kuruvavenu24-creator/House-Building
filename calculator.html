<h1 class="page-title">Smart Cost Calculator</h1>

<div class="calculator-box">

<select id="state" onchange="updateRates()">
<option value="">Select State</option>
<option>Delhi</option>
<option>Maharashtra</option>
<option>Karnataka</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Kerala</option>
<option>Gujarat</option>
<option>Rajasthan</option>
<option>West Bengal</option>
<option>Punjab</option>
<option>Haryana</option>
<option>Bihar</option>
<option>Madhya Pradesh</option>
<option>Odisha</option>
<option>Assam</option>
<option>Andhra Pradesh</option>
<option>Jharkhand</option>
<option>Chhattisgarh</option>
<option>Goa</option>
</select>

<select id="quality">
<option value="1">Basic</option>
<option value="1.15">Standard</option>
<option value="1.30">Premium</option>
</select>

<input type="number" id="area" placeholder="Total Area (sq ft)">
<input type="number" id="material" placeholder="Material Rate">
<input type="number" id="labour" placeholder="Labour Rate">

<button onclick="calculateCost()">Calculate</button>

<div id="resultCost"></div>
</div>

<canvas id="costChart" style="max-width:500px;margin:40px auto;"></canvas>

<script src="script.js"></script>

</body>
</html>
