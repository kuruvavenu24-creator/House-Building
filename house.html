<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian House Construction Pro</title>

<!-- jsPDF CDN for PDF Download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* DARK CONSTRUCTION THEME */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
}

nav {
  background: #111827;
  padding: 15px;
  position: sticky;
  top: 0;
}

nav ul {
  display: flex;
  justify-content: center;
  gap: 30px;
  list-style: none;
  margin: 0;
  padding: 0;
}

nav a {
  color: #38bdf8;
  text-decoration: none;
  font-weight: bold;
}

.hero {
  text-align: center;
  padding: 70px 20px;
  background: linear-gradient(to right, #1e293b, #0f172a);
}

section {
  padding: 60px 20px;
  max-width: 1000px;
  margin: auto;
  opacity: 0;
  transform: translateY(40px);
  transition: 0.8s ease;
}

section.show {
  opacity: 1;
  transform: translateY(0);
}

.card {
  background: #1e293b;
  padding: 20px;
  margin: 15px 0;
  border-radius: 10px;
}

.image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
}

.image-grid img {
  width: 100%;
  border-radius: 10px;
}

input, select {
  padding: 10px;
  margin: 10px 5px 10px 0;
}

button {
  padding: 10px 20px;
  background: #38bdf8;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0ea5e9;
}

.result {
  margin-top: 20px;
  font-weight: bold;
  color: #38bdf8;
}

footer {
  text-align: center;
  padding: 20px;
  background: #111827;
  margin-top: 40px;
}

</style>
</head>
<body>

<div class="hero">
  <h1>🏠 Indian Construction Cost Estimator</h1>
  <p>City-wise Rates + PDF Report + Dark Theme</p>
</div>

<nav>
  <ul>
    <li><a href="#gallery">Gallery</a></li>
    <li><a href="#calculator">Calculator</a></li>
  </ul>
</nav>

<!-- GALLERY -->
<section id="gallery">
  <h2>🏗️ Construction Gallery</h2>
  <div class="image-grid">
    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
    <img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be">
    <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae">
  </div>
</section>

<!-- CALCULATOR -->
<section id="calculator">
  <h2>💰 Construction Cost Calculator</h2>

  <label>Select City:</label>
  <select id="city">
    <option value="delhi">Delhi</option>
    <option value="bangalore">Bangalore</option>
    <option value="chennai">Chennai</option>
  </select>

  <br>

  <label>Enter Area (sq ft):</label>
  <input type="number" id="area" placeholder="Enter square feet">

  <br>

  <button onclick="calculateCost()">Calculate</button>
  <button onclick="downloadPDF()">Download PDF Report</button>

  <div class="result" id="result"></div>
</section>

<footer>
  © 2026 Indian Construction Pro | Built for Learning
</footer>

<script>

const rates = {
  delhi: { cement: 420, steel: 72, brick: 6, sand: 55 },
  bangalore: { cement: 400, steel: 70, brick: 5, sand: 50 },
  chennai: { cement: 390, steel: 68, brick: 5, sand: 48 }
};

let lastReport = "";

function calculateCost() {

  let area = document.getElementById("area").value;
  let city = document.getElementById("city").value;

  if(area <= 0){
    alert("Enter valid area");
    return;
  }

  let cityRates = rates[city];

  let cementBags = area * 0.4;
  let steelKg = area * 4;
  let bricks = area * 8;
  let sandCft = area * 1.8;

  let cementCost = cementBags * cityRates.cement;
  let steelCost = steelKg * cityRates.steel;
  let brickCost = bricks * cityRates.brick;
  let sandCost = sandCft * cityRates.sand;

  let total = cementCost + steelCost + brickCost + sandCost;

  lastReport =
  "City: " + city.toUpperCase() + "\n" +
  "Area: " + area + " sq ft\n\n" +
  "Cement Bags: " + Math.round(cementBags) + "\n" +
  "Steel (kg): " + Math.round(steelKg) + "\n" +
  "Bricks: " + Math.round(bricks) + "\n" +
  "Sand (cu ft): " + Math.round(sandCft) + "\n\n" +
  "Total Estimated Material Cost: ₹" + total.toLocaleString();

  document.getElementById("result").innerHTML =
    "Total Estimated Cost: ₹" + total.toLocaleString();
}

/* PDF Download */
function downloadPDF() {

  if(lastReport === ""){
    alert("Please calculate cost first!");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text(lastReport, 10, 10);
  doc.save("Construction_Report.pdf");
}

/* Animation */
const sections = document.querySelectorAll("section");
window.addEventListener("scroll", () => {
  sections.forEach(sec => {
    const top = sec.getBoundingClientRect().top;
    if (top < window.innerHeight - 100) {
      sec.classList.add("show");
    }
  });
});

</script>

</body>
</html>
